# Site settings
title: "Houblons Nous"
email: "houblonsnousbb@gmail.com"
description: "Bar à bières, Bois Blancs, Lille"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://houblons-nous.org" # the base hostname & protocol for your site

# Author information
author:
  name: "Houblons Nous"
  email: "houblonsnousbb@gmail.com"

# Social media
social:
  name: "Houblons Nous"
  links:
    - "https://www.facebook.com/groups/HoublonsNous"
    - "https://www.instagram.com/houblonsnousboisblancs/"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

# Plugins configuration
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-compress-images
  - jekyll-minifier

# Pagination
paginate: 10
paginate_path: "/page:num/"

# SEO configuration
seo:
  title: "Houblons Nous"
  description: "Bar à bières, Bois Blancs, Lille"
  image: "/assets/images/logo-rond.png"
  type: "website"

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# =====================================================
# BASEROW CMS CONFIGURATION
# =====================================================
# Jekyll Baserow Headless CMS Plugin — disabled by default until the Baserow
# table below exists and BASEROW_TOKEN / BASEROW_POSTS_TABLE are set.
# Enable by flipping `baserow.enabled` to true once configured.
baserow:
  enabled: false

  collections:
    posts:
      table_env: BASEROW_POSTS_TABLE
      data_file: baserow_posts.yml
      organizer: simple_list
      sort_by: published_at
      sort_order: desc
      fields:
        - { name: Title, type: text }
        - { name: Slug, type: text }
        - { name: Published At, type: date, key: published_at }
        - { name: Status, type: single_select } # draft, published, archived
        - { name: Excerpt, type: long_text }
        - { name: Content, type: long_text }
        - { name: Featured Image, type: file, key: featured_image }
        - { name: Categories, type: multi_select }
        - { name: Tags, type: multi_select }
        - { name: Author, type: text }

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - bun.lock
  - node_modules
  - vendor/
  - .jekyll-cache/
  - .sass-cache/
  - _site/
  - .env
  - .env.local
  - .env.example
  - env.sample
  - docs/
  - Makefile
  - CLAUDE.md
  - README.md
  - CONTRIBUTING.md
  - CHANGELOG.md
  - LICENSE
  - renovate.json
  - commitlint.config.js
  - .releaserc.json
  - .gitmoji.json
  - .markdownlint.json
  - .yamllint.yml
  - .editorconfig
  - .tool-versions
  - .github/
  - .husky/
  - .idea/
