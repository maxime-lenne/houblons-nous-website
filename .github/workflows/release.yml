name: Release

# Runs semantic-release when commits land on main (a merged PR pushes to main).
# A pull_request event cannot be used: semantic-release never publishes from a
# pull request context.
#
# The 🔖 Release commit is pushed to the protected main branch: this needs a
# RELEASE_TOKEN secret holding a PAT of a repository admin (admins bypass the
# protection, GITHUB_TOKEN cannot). See docs/TECHNICAL_GUIDE.md#release-token.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    # Skip the push of the release commit itself
    if: ${{ !startsWith(github.event.head_commit.message, '🔖 Release') }}
    runs-on: ubuntu-latest
    env:
      # No git hooks in CI: lint-staged/commitlint must not run on the release commit
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning::RELEASE_TOKEN secret is missing: the release commit cannot be pushed to a protected main branch"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: bun run release

      # Rebase develop onto main (rewritten SHAs + 🔖 Release commit) so the next
      # develop → main PR is up to date. On conflict, run `bun run sync:develop`.
      - name: Sync develop with main
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SYNC_REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            bun scripts/sync-develop.js
