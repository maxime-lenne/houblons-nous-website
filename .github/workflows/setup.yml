name: Repository Setup

# Applies .github/settings.yml (branches, repository settings, security,
# labels, branch protection) with scripts/setup-github.js.
# Same as running `bun run setup:github` locally with an admin gh session.
#
# Requires a secret named ADMIN_TOKEN with a PAT (fine-grained or classic)
# with repository Administration (read & write) permissions.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only show what would change
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    name: Apply Repository Settings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Apply settings
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: bun scripts/setup-github.js ${{ inputs.dry-run && '--dry-run' || '' }}
