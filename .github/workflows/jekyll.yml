# Builds and deploys the Jekyll site to GitHub Pages on every push to main.
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      baserow_event:
        description: 'Type of Baserow event'
        required: false
        type: string
        default: 'webhook'
      row_id:
        description: 'Baserow row ID'
        required: false
        type: string
      table_id:
        description: 'Baserow table ID'
        required: false
        type: string
        default: 'all'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3.5'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: make production
        env:
          JEKYLL_ENV: production
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
          BASEROW_API_URL: ${{ secrets.BASEROW_API_URL }}
          BASEROW_LOCATIONS_TABLE: ${{ secrets.BASEROW_LOCATIONS_TABLE }}
          BASEROW_PEOPLE_TABLE: ${{ secrets.BASEROW_PEOPLE_TABLE }}
          BASEROW_BIERES_TABLE: ${{ secrets.BASEROW_BIERES_TABLE }}
          BASEROW_EVENEMENTS_TABLE: ${{ secrets.BASEROW_EVENEMENTS_TABLE }}
          BASEROW_ASSOCIATIONS_TABLE: ${{ secrets.BASEROW_ASSOCIATIONS_TABLE }}
          BASEROW_QUARTIER_EVENEMENTS_TABLE: ${{ secrets.BASEROW_QUARTIER_EVENEMENTS_TABLE }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
