---
<!DOCTYPE html>
<html lang="fr">
  {% include head.html %}
  <body class="hero-page">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content" class="hero">
      <div class="hero__banner">
        <img
          src="{{ '/assets/images/photo-mur.png' | relative_url }}"
          alt="Fresque murale Houblons Nous : un houblon peint sur un mur de brique et un poisson-houblon peint sur une porte de garage en bois"
          width="3342" height="816" loading="eager">
        <p class="hero__place accent">Bois Blancs · Lille</p>
      </div>

      <div class="hero__panel">
        <img
          class="hero__logo"
          src="{{ '/assets/images/logo-horizontal.png' | relative_url }}"
          alt="{{ site.title }}"
          width="1472" height="400">

        <h1 class="hero__title">{{ page.title }}</h1>

        <div class="hero__lede">
          {{ content }}
        </div>

        <img
          class="hero__pictos"
          src="{{ '/assets/images/logo-rond.png' | relative_url }}"
          alt="Badge Houblons Nous : poisson-houblon, bouleaux et deux verres de bière trinqués, Bois Blancs · Lille"
          width="1254" height="1254" loading="lazy">
      </div>
    </main>
    {% include footer.html %}
  </body>
</html>
