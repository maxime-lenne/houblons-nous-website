---
extends: default

rules:
  line-length:
    max: 200
    level: warning
  truthy:
    allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']
    check-keys: false
  document-start: disable
  comments:
    min-spaces-from-content: 1
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
  indentation:
    spaces: 2
    indent-sequences: true

ignore:
  - node_modules/
  - dist/
  - .git/
  - _site/
  - vendor/
  - .jekyll-cache/
  # Auto-generated by jekyll-baserow-headless-cms on every build (see
  # docs/AGENTS.md#baserow-cms) — Ruby's Hash#to_yaml indents the block
  # sequence under a multi-select field (locations' Type, associations'
  # Theme) 2 spaces, which trips indent-sequences: true. Not hand-authored,
  # so not worth reformatting on every regeneration.
  - _data/baserow_locations.yml
  - _data/quartier_assos.yml
